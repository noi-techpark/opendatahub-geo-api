<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EUREGIO Mountain Bike Routes - Trentino</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <link href='../css/style.css' rel='stylesheet'>
</head>
<body>
    <h1>EUREGIO Mountain Bike Routes - Trentino</h1>
    <div class="debug">
        <strong>🔍 Debug Info</strong><br>
        <div id="info">Loading...</div>
    </div>
    <div id="map"></div>
        <!-- Include the reusable library -->
    <script src="../js/vector-tile-map.js"></script>
    <script src="../js/config.js"></script>

    <!-- Initialize with your config -->
    <script>
        const myMap = new VectorTileMap({
            containerId: 'map',
            type: 'spatialdata',
            apiUrl: CONFIG.apiUrl,
            additional: '?source=euregio&tagfilter=and(mountain%20bike,trentino)&operationmode=pointsandtracks&displaytracksonzoomlevel=10',
            center: [11.12, 46.07],
            zoom: 9
        });
    </script>
</body>
</html>
