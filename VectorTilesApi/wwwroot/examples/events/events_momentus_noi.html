<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Events with Source momentus and noi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <link href='../css/style.css' rel='stylesheet'>
</head>
<body>
    <h1>Events with Source momentus and noi</h1>
    <div class="debug">
        <strong>🔍 Debug Info</strong><br>
        <div id="info">Loading...</div>
    </div>
    <div id="map"></div>
        <!-- Include the reusable library -->
    <script src="../js/vector-tile-map.js"></script>
    <script src="../js/config.js"></script>
    <!-- Initialize with your config -->
    <script>
        const myMap = new VectorTileMap({
            containerId: 'map',
            type: 'event',
            apiUrl: CONFIG.apiUrl,
            additional: '?source=momentus,noi&enableclustering=true&begindate=' + new Date().toISOString().slice(0, 10),
            center: [11.35, 46.5],
            zoom: CONFIG.defaultZoom
        });
    </script>
</body>
</html>
