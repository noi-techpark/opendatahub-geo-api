name: CI/CD API

on:
  push:
  pull_request:

env:
  PROJECT_NAME: odh-geo-api
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - name: REUSE Compliance Check
      uses: fsfe/reuse-action@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore opendatahub-geo-api.sln
    - name: Build opendatahub-geo-api Solution
      run: dotnet build opendatahub-geo-api.sln --no-restore

  # Deploy Test (Kubernetes / EKS)
  deploy-test-api:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: test
    concurrency: deploy-test-api
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: VectorTilesApi
          docker-compose-file: docker-compose.yml

      # https://github.com/shrink/actions-docker-registry-tag
      - name: Add an "unstable" docker tag
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}
          target: ${{ env.DOCKER_TAG }}
          tags: |
            unstable

      - name: Customize geo-api-test.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/geo-api-test.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/geo-api-test.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/geo-api-test.yaml

          yq -i '.envSecret.ASPNETCORE_PG_CONNECTION="${{ secrets.PG_CONNECTION_TEST }}"' infrastructure/helm/geo-api-test.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: geo-api
          k8s-namespace: core
          chart-path: infrastructure/helm/geo-api
          values-file: infrastructure/helm/geo-api-test.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  # Deploy Prod (Kubernetes / EKS)
  deploy-prod-api:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/prod'
    needs: test
    environment: prod
    concurrency: deploy-prod-api
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: VectorTilesApi
          docker-compose-file: docker-compose.yml

      # https://github.com/shrink/actions-docker-registry-tag
      - name: Add a "latest" docker tag
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}
          target: ${{ env.DOCKER_TAG }}
          tags: |
            latest

      - name: Customize geo-api-prod.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/geo-api-prod.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/geo-api-prod.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/geo-api-prod.yaml

          yq -i '.envSecret.ASPNETCORE_PG_CONNECTION="${{ secrets.PG_CONNECTION_PROD }}"' infrastructure/helm/geo-api-prod.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: geo-api
          k8s-namespace: core
          chart-path: infrastructure/helm/geo-api
          values-file: infrastructure/helm/geo-api-prod.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
